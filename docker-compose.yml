services:
  gist:
    build: .
    image: gist:local
    restart: unless-stopped
    env_file: .env
    environment:
      GIST_BIND: 0.0.0.0:8787
      GIST_DATA: /data
      GIST_PUBLIC_URL: https://gist.example.com
    volumes:
      - gist-data:/data
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  gist-data:
